name: Refresh portfolio dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-dashboard.yml"
      - "scripts/**"
      - "requirements.txt"
  schedule:
    # GitHub cron uses UTC. Hourly at :47 past on weekdays, ~09:17 IST through
    # 16:17 IST. Offset from :00 to reduce scheduler congestion.
    - cron: "47 3-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh-portfolio-dashboard
  # Let an in-progress refresh finish and commit; a new run queues behind it.
  # (Cancelling mid-run was leaving the dashboard un-updated when a refresh
  # took longer than the schedule interval.)
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Refresh prices
        run: python scripts/refresh_prices.py --input data/holdings.csv --output data/holdings.csv

      - name: Refresh technical indicators
        run: python scripts/refresh_technical_indicators.py --input data/holdings.csv --output data/holdings.csv --period 2y --benchmark ^NSEMDCP50

      - name: Build dashboard
        run: |
          python scripts/build_client_portfolio_dashboard.py --input data/holdings.csv --output-dir build
          python scripts/prepare_pages.py --dashboard build/local/index.html --output-dir .

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html .nojekyll data/holdings.csv
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "Refresh client portfolio dashboard"
            # Rebase onto any commit that landed during this long refresh so a
            # benign concurrent update doesn't reject an otherwise-valid push.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
